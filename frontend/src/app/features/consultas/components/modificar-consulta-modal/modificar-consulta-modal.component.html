<div class="modal-backdrop" appFondoModal (fondoClick)="cerrar.emit()">
  <div class="modal-card" style="max-width:700px;" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Modificar Consulta Finalizada (Regla de Auditoría)</h3>
      <button class="modal-close" (click)="cerrar.emit()">&times;</button>
    </div>
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="enviar()">
        <div class="form-group">
          <label class="form-label">Motivo de Consulta</label>
          <textarea class="form-control" rows="2" formControlName="motivoConsulta"></textarea>
        </div>
        <app-signos-vitales-campos [grupo]="form.controls.signos" />
        <div class="form-group">
          <label class="form-label">Diagnóstico</label>
          <input type="text" class="form-control" formControlName="diagnostico" />
        </div>
        <div class="form-group">
          <label class="form-label">Tratamiento</label>
          <textarea class="form-control" rows="3" formControlName="tratamiento"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Observaciones</label>
          <textarea class="form-control" rows="2" formControlName="observaciones"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Motivo de Modificación (obligatorio para la bitácora de auditoría)</label>
          <select class="form-control" formControlName="idMotivoModificacionConsulta">
            <option [ngValue]="null" disabled>Seleccione un motivo...</option>
            @for (motivo of motivos(); track motivo.id) {
              <option [ngValue]="motivo.id">{{ motivo.nombre }}</option>
            }
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="form.invalid || guardando()" (click)="enviar()">
        Aplicar Modificación Auditada
      </button>
    </div>
  </div>
</div>
