<div class="modal-backdrop" appFondoModal (fondoClick)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Reemplazar Documento (Regla de Auditoría)</h3>
      <button class="modal-close" (click)="cerrar.emit()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-warning" style="font-size:12px;">
        Esta acción conservará el archivo anterior en el almacenamiento pero actualizará la referencia activa de
        <strong>{{ documento().nombre }}</strong>. <strong>Es obligatorio indicar el motivo para la auditoría.</strong>
      </div>
      <div class="form-group">
        <label class="form-label">Nuevo Archivo de Reemplazo</label>
        <input type="file" class="form-control" [accept]="extensiones" (change)="seleccionarArchivo($event)" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Motivo de Reemplazo (Requerido para Auditoría)</label>
          <select class="form-control" (change)="idMotivo.set(+$any($event.target).value || null)">
            <option value="">Seleccione motivo...</option>
            @for (motivo of motivos(); track motivo.id) {
              <option [value]="motivo.id">{{ motivo.nombre }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Categoría (solo si cambia)</label>
          <select class="form-control" (change)="idCategoria.set(+$any($event.target).value || null)">
            <option value="">Conservar: {{ documento().categoriaDocumentoResponseDTO.nombre }}</option>
            @for (categoria of categorias(); track categoria.id) {
              <option [value]="categoria.id">{{ categoria.nombre }}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="!archivo() || !idMotivo() || guardando()" (click)="guardar()">
        {{ guardando() ? 'Guardando...' : 'Guardar Actualización Auditada' }}
      </button>
    </div>
  </div>
</div>
