<div class="modal-backdrop" (click)="cerrar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Subir Documento Clínico</h3>
      <button class="modal-close" (click)="cerrar.emit()">&times;</button>
    </div>
    <div class="modal-body">
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }
      <div class="form-group">
        <label class="form-label">Paciente Asignado</label>
        <input
          type="text"
          class="form-control"
          [value]="(paciente() | nombreCompleto) + ' (DPI: ' + paciente().dpi + ')'"
          readonly
          style="background-color:var(--color-bg-light);"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Categoría del Documento</label>
        <select class="form-control" (change)="idCategoria.set(+$any($event.target).value || null)">
          <option value="">Seleccione categoría...</option>
          @for (categoria of categorias(); track categoria.id) {
            <option [value]="categoria.id">{{ categoria.nombre }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Seleccionar Archivo (PDF, DICOM, JPG, PNG)</label>
        <input type="file" class="form-control" [accept]="extensiones" (change)="seleccionarArchivo($event)" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cerrar.emit()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="!archivo() || !idCategoria() || subiendo()" (click)="subir()">
        {{ subiendo() ? 'Subiendo...' : 'Subir e Integrar' }}
      </button>
    </div>
  </div>
</div>
