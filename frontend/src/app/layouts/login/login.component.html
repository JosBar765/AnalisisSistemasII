<div class="login-container">
  <div class="login-header">
    <img src="logo.png" alt="MediSistema" class="login-logo">
    <h1 class="login-title">Acceso al Sistema</h1>
    <p class="login-subtitle">Gestión Clínica y Control Hospitalario</p>
  </div>

  <div class="login-body">
    <form (ngSubmit)="ingresar()">
      <div class="form-group">
        <label class="form-label" for="username">Usuario o Correo Electrónico</label>
        <input type="text" id="username" class="form-control" value="admin@medisistema.com"
          placeholder="usuario@medisistema.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" value="Admin123*" placeholder="Contraseña">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
