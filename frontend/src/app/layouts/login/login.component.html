<div class="login-container">
  <div class="login-header">
    <img src="logo.png" alt="MediSistema" class="login-logo">
    <h1 class="login-title">Acceso al Sistema</h1>
    <p class="login-subtitle">Gestión Clínica y Control Hospitalario</p>
  </div>

  <div class="login-body">
    <form [formGroup]="form" (ngSubmit)="ingresar()">
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="correo">Correo Electrónico</label>
        <input type="email" id="correo" class="form-control" formControlName="correo"
          placeholder="usuario@medisistema.com" autocomplete="username">
        @if (form.controls.correo.touched && form.controls.correo.invalid) {
          <div class="form-error">Ingresa un correo válido.</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="contrasenia">Contraseña</label>
        <input type="password" id="contrasenia" class="form-control" formControlName="contrasenia"
          placeholder="Contraseña" autocomplete="current-password">
        @if (form.controls.contrasenia.touched && form.controls.contrasenia.invalid) {
          <div class="form-error">La contraseña es obligatoria.</div>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;"
        [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>
