spring.application.name=medisistema

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true

# Servidor
server.port=${SERVER_PORT}

# CORS
# Si no se define, se permite el frontend local en FRONTEND_PORT (4200 por defecto).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:${FRONTEND_PORT:4200}}

# IMPORT DEL .env
spring.config.import=optional:file:../.env[.properties]

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480

# Archivos clinicos (subida multipart)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Supabase Storage (documentos clinicos). Sin credenciales el resto de la API funciona,
# pero subir o leer documentos responde 503.
app.supabase.url=${SUPABASE_URL}
app.supabase.service-key=${SUPABASE_SERVICE_KEY}
app.supabase.bucket=${SUPABASE_BUCKET}
